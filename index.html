<script>
/* =========================================================
   GAME PESAWAT PEMBURU — tembak jawaban Pythagoras yang benar
   Soal muncul di atas, musuh membawa pilihan jawaban melayang turun.
   Tembak jawaban BENAR → poin. Tembak salah / lolos → nyawa berkurang.
   ========================================================= */
(function () {
  'use strict';

  /* ---------- soal Pythagoras ---------- */
  const SOAL = (() => {
    const tripel = [
      [3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],
      [9,12,15],[10,24,26],[20,21,29],[9,40,41],[12,35,37],
      [15,20,25],[5,10,11],[8,10,13],[6,9,11],[4,7,9],
    ];
    const soal = [];
    tripel.forEach(([a,b,c]) => {
      // cari c
      soal.push({ soal:`a=${a}, b=${b}, c=?`, jawab:c, salah:[c+1,c-1,c+2,Math.round(Math.sqrt(a*a+b*b+1))] });
      // cari a
      soal.push({ soal:`b=${b}, c=${c}, a=?`, jawab:a, salah:[a+1,a-1,a+3,Math.round(Math.sqrt(c*c-b*b+4))] });
      // benar/salah — apakah ini tripel Pythagoras?
      soal.push({ soal:`${a}²+${b}²=${c}²?`, jawab:'Ya', salah:['Tidak','Mungkin','Salah'] });
    });
    // tambah soal salah-benar palsu
    [[3,4,6],[5,12,14],[6,8,11]].forEach(([a,b,c]) => {
      soal.push({ soal:`${a}²+${b}²=${c}²?`, jawab:'Tidak', salah:['Ya','Mungkin','Benar'] });
    });
    return soal;
  })();

  function acak(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function unik(jawab, salah) {
    const pool = shuffle(salah.filter(s=>String(s)!==String(jawab))).slice(0,3);
    return shuffle([jawab, ...pool].slice(0,4));
  }

  PP.screens.game_pesawat = function () {
    return {
      html: `<div class="gp-wrap" id="gpWrap">
        <canvas id="gpCanvas" style="display:block;width:100%;height:100%;image-rendering:pixelated"></canvas>
        <div id="gpUI" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none"></div>
      </div>`,
      mount(root) { startGame(root); }
    };
  };

  function startGame(root) {
    const wrap = root.querySelector('#gpWrap');
    const canvas = root.querySelector('#gpCanvas');
    const ui = root.querySelector('#gpUI');
    wrap.style.cssText = 'position:relative;width:100%;height:100%;background:#0a0e2e;overflow:hidden';

    let W, H;
    function resize() {
      W = canvas.offsetWidth; H = canvas.offsetHeight;
      canvas.width = W; canvas.height = H;
    }
    resize();
    const obs = new ResizeObserver(resize); obs.observe(canvas);

    const ctx = canvas.getContext('2d');

    // State
    let poin = 0, nyawa = 3, combo = 0, maxCombo = 0;
    let running = true, soalIdx = 0;
    let pesawat = { x: 0.5, y: 0.85, w: 48, h: 40 };
    let peluru = [];
    let musuh = [];   // { x, y, label, benar, w, h, hp }
    let bintang = []; // background stars
    let ledakan = []; // efek
    let curSoal = null;
    let tick = 0;
    let spawnTimer = 0, spawnInterval = 120;
    let touch = { active: false, x: 0 };
    let gameOver = false;

    // Bintang latar
    for (let i=0; i<60; i++) bintang.push({ x: Math.random(), y: Math.random(), r: Math.random()*1.5+0.5, s: Math.random()*0.5+0.3 });

    function nextSoal() {
      curSoal = SOAL[soalIdx % SOAL.length];
      soalIdx = (soalIdx+1) % SOAL.length;
      if (soalIdx===0) soalIdx = Math.floor(Math.random()*SOAL.length);
      musuh = [];
      spawnTimer = 0;
      spawnInterval = Math.max(50, 120 - Math.floor(poin/5)*5);
    }

    function spawnMusuh() {
      if (!curSoal) return;
      const opts = unik(curSoal.jawab, curSoal.salah);
      const taken = [];
      opts.forEach((label, i) => {
        let x;
        do { x = 0.1 + Math.random()*0.8; } while (taken.some(t=>Math.abs(t-x)<0.22));
        taken.push(x);
        const benar = String(label)===String(curSoal.jawab);
        musuh.push({ x, y: -0.08, label, benar, w: 70, h: 36, speed: 0.0008+Math.random()*0.0004, hp:1 });
      });
    }

    function tembak() {
      peluru.push({ x: pesawat.x, y: pesawat.y - 0.04, speed: 0.018 });
    }

    function cekTumbukan() {
      peluru.forEach(p => {
        musuh.forEach(m => {
          const px = p.x*W, py = p.y*H, mx = m.x*W, my = m.y*H;
          if (Math.abs(px-mx)<m.w/2+4 && Math.abs(py-my)<m.h/2+6) {
            p.dead = true;
            if (m.benar) {
              m.dead = true;
              poin += (1 + combo);
              combo++;
              if (combo > maxCombo) maxCombo = combo;
              ledakan.push({ x: m.x, y: m.y, t: 1, benar: true, label: '+'+((1+combo-1)) });
              // hapus semua musuh dan minta soal baru
              musuh.forEach(z => z.dead = true);
              setTimeout(nextSoal, 400);
            } else {
              m.dead = true;
              combo = 0;
              nyawa--;
              ledakan.push({ x: m.x, y: m.y, t: 1, benar: false, label: '✗' });
              if (nyawa <= 0) { running = false; gameOver = true; showGameOver(); }
            }
          }
        });
      });
      // musuh lolos ke bawah
      musuh.forEach(m => {
        if (m.y > 1.1 && m.benar && !m.dead) {
          m.dead = true; combo = 0; nyawa--;
          if (nyawa <= 0) { running = false; gameOver = true; showGameOver(); }
        }
      });
      peluru = peluru.filter(p => !p.dead && p.y > -0.05);
      musuh = musuh.filter(m => !m.dead);
    }

    function update() {
      if (!running) return;
      tick++;
      // gerak bintang
      bintang.forEach(b => { b.y += b.s*0.0008; if(b.y>1) b.y=0; });
      // gerak peluru
      peluru.forEach(p => { p.y -= p.speed; });
      // gerak musuh
      musuh.forEach(m => { m.y += m.speed; });
      // ledakan
      ledakan.forEach(l => { l.t -= 0.04; }); ledakan = ledakan.filter(l=>l.t>0);
      // spawn
      if (!curSoal || musuh.length===0) {
        spawnTimer++;
        if (spawnTimer >= 30) { nextSoal(); spawnMusuh(); }
      }
      cekTumbukan();
      // auto tembak
      if (tick % 18 === 0) tembak();
    }

    function drawPesawat(x, y) {
      const px = x*W, py = y*H;
      ctx.save();
      ctx.translate(px, py);
      // body
      ctx.fillStyle = '#7ec8f7';
      ctx.beginPath();
      ctx.moveTo(0,-20); ctx.lineTo(14,10); ctx.lineTo(0,4); ctx.lineTo(-14,10); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#2a5f8a'; ctx.lineWidth=1.5; ctx.stroke();
      // cockpit
      ctx.fillStyle='#b6eaff';
      ctx.beginPath(); ctx.ellipse(0,-6,5,8,0,0,Math.PI*2); ctx.fill();
      // sayap
      ctx.fillStyle='#4a9fd0';
      ctx.beginPath(); ctx.moveTo(-14,10); ctx.lineTo(-22,18); ctx.lineTo(-10,14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(14,10); ctx.lineTo(22,18); ctx.lineTo(10,14); ctx.closePath(); ctx.fill();
      // api mesin
      if (tick%4<2) {
        ctx.fillStyle='#ff9933';
        ctx.beginPath(); ctx.moveTo(-4,10); ctx.lineTo(4,10); ctx.lineTo(0,20+Math.random()*6); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    function drawMusuh(m) {
      const mx = m.x*W, my = m.y*H;
      const benar = m.benar;
      ctx.save();
      ctx.translate(mx, my);
      // body UFO
      ctx.fillStyle = benar ? '#ff5252' : '#8b5cf6';
      ctx.beginPath(); ctx.ellipse(0,0,m.w/2,m.h/2,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = benar ? '#ff1744' : '#6d28d9'; ctx.lineWidth=2; ctx.stroke();
      // kubah
      ctx.fillStyle = benar ? '#ff867c' : '#a78bfa';
      ctx.beginPath(); ctx.ellipse(0,-4,m.w/3,m.h/2.5,0,Math.PI,0); ctx.fill();
      // label
      ctx.fillStyle='#fff';
      ctx.font = `bold ${Math.min(16, m.w/4.5)}px Nunito,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(m.label), 0, 2);
      ctx.restore();
    }

    function drawPeluru(p) {
      const px = p.x*W, py = p.y*H;
      ctx.save();
      ctx.fillStyle='#ffe066';
      ctx.shadowColor='#ffd700'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.ellipse(px,py,3,8,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function drawLedakan(l) {
      const lx = l.x*W, ly = l.y*H, r = (1-l.t)*50;
      ctx.save(); ctx.globalAlpha = l.t;
      ctx.fillStyle = l.benar ? '#4ade80' : '#f87171';
      ctx.beginPath(); ctx.arc(lx,ly,r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.font='bold 20px Nunito,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(l.label, lx, ly-20);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      // latar
      const grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,'#0a0e2e'); grad.addColorStop(1,'#1a1050');
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      // bintang
      bintang.forEach(b => {
        ctx.fillStyle=`rgba(255,255,255,${b.s})`;
        ctx.beginPath(); ctx.arc(b.x*W,b.y*H,b.r,0,Math.PI*2); ctx.fill();
      });
      // soal
      if (curSoal) {
        ctx.fillStyle='rgba(255,255,255,0.12)';
        ctx.beginPath(); ctx.roundRect(W/2-160,8,320,44,10); ctx.fill();
        ctx.fillStyle='#ffe066';
        ctx.font='bold 15px Nunito,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('Jika '+curSoal.soal, W/2, 30);
      }
      // HUD
      ctx.fillStyle='#fff'; ctx.font='bold 14px Nunito,sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='top';
      ctx.fillText('⭐ '+poin, 10, 10);
      ctx.textAlign='right';
      ctx.fillText('❤'.repeat(nyawa)+'🖤'.repeat(Math.max(0,3-nyawa)), W-10, 10);
      if (combo>1) {
        ctx.fillStyle='#ffd34d'; ctx.textAlign='center';
        ctx.font='bold 13px Nunito,sans-serif';
        ctx.fillText('COMBO x'+combo+'!', W/2, 56);
      }
      // musuh, peluru, pesawat, ledakan
      musuh.forEach(drawMusuh);
      peluru.forEach(drawPeluru);
      drawPesawat(pesawat.x, pesawat.y);
      ledakan.forEach(drawLedakan);
    }

    // Input
    function movePesawat(nx) { pesawat.x = Math.max(0.05, Math.min(0.95, nx)); }

    canvas.style.cursor = 'none';
    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      movePesawat((e.clientX - r.left) / r.width);
    });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      movePesawat((e.touches[0].clientX - r.left) / r.width);
    }, { passive: false });
    canvas.addEventListener('click', tembak);

    function showGameOver() {
      obs.disconnect();
      ui.style.pointerEvents = 'auto';
      ui.innerHTML = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.7)">
        <div style="background:#1e1b4b;border:3px solid #7c3aed;border-radius:16px;padding:28px 36px;text-align:center;color:#fff;max-width:300px">
          <div style="font-size:48px">🚀</div>
          <h2 style="color:#ffe066;font-family:Nunito,sans-serif;margin:8px 0">Game Over!</h2>
          <p style="font-size:18px;margin:4px 0">Skor: <b style="color:#ffd34d">${poin}</b></p>
          <p style="font-size:14px;color:#a5b4fc">Combo tertinggi: ${maxCombo}</p>
          <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
            <button onclick="PP.go('game_pesawat')" style="background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:10px 20px;font:bold 15px Nunito,sans-serif;cursor:pointer">Main Lagi</button>
            <button onclick="PP.go('lomba')" style="background:#334155;color:#fff;border:none;border-radius:8px;padding:10px 20px;font:bold 15px Nunito,sans-serif;cursor:pointer">Kembali</button>
          </div>
        </div>
      </div>`;
      try { PPStore.recordMiniGame('pesawat', poin, maxCombo); } catch(e){}
    }

    // Loop
    let raf;
    function loop() {
      update(); draw();
      if (running) raf = requestAnimationFrame(loop);
    }
    nextSoal(); spawnMusuh();
    raf = requestAnimationFrame(loop);

    // Cleanup saat pindah halaman
    const orig = PP.go.bind(PP);
    const cleanup = () => { running = false; obs.disconnect(); cancelAnimationFrame(raf); };
    root.addEventListener('pp-unmount', cleanup);
  }
})();

</script>
<script>
/* =========================================================
   TETRIS PYTHAGORAS — susun segitiga agar sisinya membentuk tripel Pythagoras
   Blok berbentuk segitiga siku-siku jatuh. Ketika 3 blok berdampingan membentuk
   tripel (a²+b²=c²) mereka meledak dan pemain dapat poin.
   Kontrol: ← → geser, ↑ putar, ↓ cepat, tap kiri/kanan layar.
   ========================================================= */
(function () {
  'use strict';

  const COLS = 7, ROWS = 14;
  const TRIPEL = [
    [3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],
    [9,12,15],[10,24,26],[20,21,29]
  ];
  // nilai sisi yang valid
  const VALID_SIDES = [...new Set(TRIPEL.flatMap(t=>t))];

  // Blok = segitiga dengan nilai sisi (a, b, hipotenusa)
  // Di grid kita simpan nilai sisi yang "menghadap atas"
  const PIECES = [
    { sides:[3,4,5], color:'#ff6b6b', dark:'#c0392b' },
    { sides:[5,12,13], color:'#ffd34d', dark:'#c0a000' },
    { sides:[6,8,10], color:'#4ade80', dark:'#1a7a3a' },
    { sides:[8,15,17], color:'#60a5fa', dark:'#1a4a9a' },
    { sides:[9,12,15], color:'#c084fc', dark:'#6b21a8' },
    { sides:[7,24,25], color:'#fb923c', dark:'#a0400a' },
    { sides:[9,40,41], color:'#2dd4bf', dark:'#0f6b60' },
  ];

  function acakPiece(grid) {
    // Tanpa grid: acak biasa
    if (!grid) return { ...PIECES[Math.floor(Math.random()*PIECES.length)], rot: 0 };

    // Kumpulkan semua nilai yang sudah ada di grid
    const vals = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (grid[r][c]) vals.push(grid[r][c].val);

    // Cari nilai yang bisa melengkapi tripel dari yang sudah ada
    const needed = [];
    for (const t of TRIPEL) {
      const sorted = [...t].sort((a,b)=>a-b);
      for (let i = 0; i < sorted.length; i++) {
        const other = sorted.filter((_,j)=>j!==i);
        // jika kedua nilai lainnya sudah ada di grid
        if (other.every(v => vals.includes(v))) needed.push(sorted[i]);
      }
      // jika satu nilai sudah ada, coba berikan salah satu yang cocok
      for (let i = 0; i < sorted.length; i++) {
        if (vals.includes(sorted[i])) {
          sorted.filter((_,j)=>j!==i).forEach(v => needed.push(v));
        }
      }
    }

    // 60% chance: beri yang dibutuhkan; 40%: acak
    if (needed.length && Math.random() < 0.60) {
      const target = needed[Math.floor(Math.random()*needed.length)];
      for (const p of PIECES) {
        if (p.sides.includes(target)) {
          const rot = p.sides.indexOf(target);
          return { ...p, rot };
        }
      }
    }
    // fallback acak tapi mulai dari rot 0
    return { ...PIECES[Math.floor(Math.random()*PIECES.length)], rot: 0 };
  }

  PP.screens.game_tetris = function () {
    return {
      html: `<div id="gtWrap" style="position:relative;width:100%;height:100%;background:#0d1117;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <canvas id="gtCanvas" style="display:block;image-rendering:pixelated"></canvas>
        <div id="gtUI" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none"></div>
        <div id="gtBtns" style="position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:auto">
          <button id="gtBL" style="${BTN_STYLE}">◀</button>
          <button id="gtBD" style="${BTN_STYLE}">▼</button>
          <button id="gtBR" style="${BTN_STYLE}">▶</button>
          <button id="gtBU" style="${BTN_STYLE}↑ Putar">🔄</button>
        </div>
      </div>`,
      mount(root) { startTetris(root); }
    };
  };

  const BTN_STYLE = 'background:rgba(255,255,255,0.15);color:#fff;border:2px solid rgba(255,255,255,0.3);border-radius:12px;padding:12px 22px;font:bold 18px Nunito,sans-serif;cursor:pointer;touch-action:manipulation;';

  function startTetris(root) {
    const canvas = root.querySelector('#gtCanvas');
    const ui = root.querySelector('#gtUI');
    const wrap = root.querySelector('#gtWrap');
    const ctx = canvas.getContext('2d');

    let CW, CH, SZ; // cell size
    function resize() {
      const maxH = wrap.offsetHeight - 100;
      const maxW = wrap.offsetWidth - 20;
      SZ = Math.floor(Math.min(maxW/COLS, maxH/ROWS));
      CW = SZ*COLS; CH = SZ*ROWS;
      canvas.width = CW; canvas.height = CH;
      canvas.style.width = CW+'px'; canvas.style.height = CH+'px';
    }
    resize();
    const obs = new ResizeObserver(resize); obs.observe(wrap);

    // Grid: null atau { color, dark, val }
    let grid = Array.from({length:ROWS}, ()=>Array(COLS).fill(null));
    let cur = null, curX = 0, curY = 0;
    let next = acakPiece(null);
    let poin = 0, level = 1, lines = 0;
    let running = true, gameOver = false;
    let dropTimer = 0, dropInterval = 90; // lebih lambat di awal
    let flash = []; // { r, c, t }

    function newPiece() {
      cur = next; next = acakPiece();
      curX = Math.floor(COLS/2)-1; curY = 0;
      if (!canPlace(curX, curY, cur)) { running=false; gameOver=true; showGameOver(); }
    }

    // Footprint blok: 2×2 segitiga (4 sel, tapi kita pakai 1×2 = lebih sederhana)
    // Tiap blok = 1 sel lebar, label = nilai sisi sesuai orientasi
    function getLabelOf(piece, rot) {
      const s = piece.sides;
      return s[rot % s.length];
    }

    function canPlace(x, y, piece) {
      return x>=0 && x<COLS && y>=0 && y<ROWS && !grid[y][x];
    }

    function placePiece() {
      if (!cur) return;
      const val = getLabelOf(cur, cur.rot);
      grid[curY][curX] = { color: cur.color, dark: cur.dark, val };
      cekTripel();
      newPiece();
    }

    function cekTripel() {
      // cek semua kombinasi 3 sel berdekatan (horizontal)
      let found = false;
      for (let r=0; r<ROWS; r++) {
        for (let c=0; c<=COLS-3; c++) {
          const a=grid[r][c], b=grid[r][c+1], cc2=grid[r][c+2];
          if (a && b && cc2) {
            const vals = [a.val, b.val, cc2.val].sort((x,y)=>x-y);
            if (TRIPEL.some(t=>{
              const ts=[...t].sort((x,y)=>x-y);
              return ts[0]===vals[0]&&ts[1]===vals[1]&&ts[2]===vals[2];
            })) {
              flash.push({r,c,t:1},{r,c:c+1,t:1},{r,c:c+2,t:1});
              grid[r][c]=grid[r][c+1]=grid[r][c+2]=null;
              poin += 10*level; lines+=3; found=true;
            }
          }
        }
        // vertikal 3
        if (r<=ROWS-3) {
          for (let c=0; c<COLS; c++) {
            const a=grid[r][c], b=grid[r+1][c], cc2=grid[r+2][c];
            if (a && b && cc2) {
              const vals=[a.val,b.val,cc2.val].sort((x,y)=>x-y);
              if (TRIPEL.some(t=>{
                const ts=[...t].sort((x,y)=>x-y);
                return ts[0]===vals[0]&&ts[1]===vals[1]&&ts[2]===vals[2];
              })) {
                flash.push({r,c,t:1},{r:r+1,c,t:1},{r:r+2,c,t:1});
                grid[r][c]=grid[r+1][c]=grid[r+2][c]=null;
                poin+=10*level; lines+=3; found=true;
              }
            }
          }
        }
      }
      if (found) { level=Math.floor(lines/15)+1; dropInterval=Math.max(10,50-level*4); }
      // gravitasi sederhana: sel melayang jatuh
      for (let c=0; c<COLS; c++) {
        for (let r=ROWS-2; r>=0; r--) {
          if (grid[r][c] && !grid[r+1][c]) {
            let rr=r;
            while(rr<ROWS-1 && !grid[rr+1][c]) rr++;
            grid[rr][c]=grid[r][c]; grid[r][c]=null;
          }
        }
      }
    }

    function moveLeft() { if (canPlace(curX-1,curY,cur)) curX--; }
    function moveRight() { if (canPlace(curX+1,curY,cur)) curX++; }
    function rotate() { cur={...cur,rot:(cur.rot+1)%cur.sides.length}; }
    function drop() {
      if (canPlace(curX,curY+1,cur)) curY++;
      else placePiece();
    }
    function hardDrop() { while(canPlace(curX,curY+1,cur)) curY++; placePiece(); }

    function update() {
      if (!running) return;
      if (!cur) newPiece();
      dropTimer++;
      if (dropTimer>=dropInterval) { dropTimer=0; drop(); }
      flash.forEach(f=>f.t-=0.06); flash=flash.filter(f=>f.t>0);
    }

    function drawCell(r, c, cell, alpha=1) {
      const x=c*SZ, y=r*SZ;
      ctx.save(); ctx.globalAlpha=alpha;
      ctx.fillStyle=cell.color;
      ctx.fillRect(x+1,y+1,SZ-2,SZ-2);
      ctx.fillStyle=cell.dark;
      ctx.fillRect(x+1,y+1,SZ-2,4);
      ctx.fillRect(x+1,y+1,4,SZ-2);
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.fillRect(x+SZ-5,y+1,4,SZ-2);
      // nilai
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.font=`bold ${Math.max(10,SZ*0.38)}px Nunito,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(cell.val), x+SZ/2, y+SZ/2);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0,0,CW,CH);
      // latar grid
      ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,CW,CH);
      for (let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
        ctx.strokeStyle='rgba(255,255,255,0.05)';
        ctx.lineWidth=0.5;
        ctx.strokeRect(c*SZ,r*SZ,SZ,SZ);
      }
      // sel grid
      for (let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
        if (grid[r][c]) drawCell(r,c,grid[r][c]);
      }
      // flash
      flash.forEach(f => {
        ctx.save(); ctx.globalAlpha=f.t*0.7;
        ctx.fillStyle='#fff';
        ctx.fillRect(f.c*SZ,f.r*SZ,SZ,SZ);
        ctx.restore();
      });
      // shadow (ghost)
      if (cur) {
        let gy=curY;
        while(canPlace(curX,gy+1,cur)) gy++;
        if (gy!==curY) drawCell(gy,curX,{color:'rgba(255,255,255,0.1)',dark:'rgba(0,0,0,0)',val:getLabelOf(cur,cur.rot)},0.4);
      }
      // current piece
      if (cur) drawCell(curY,curX,{color:cur.color,dark:cur.dark,val:getLabelOf(cur,cur.rot)});
      // HUD
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,CW,28);
      ctx.fillStyle='#ffe066'; ctx.font='bold 13px Nunito,sans-serif';
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText('⭐ '+poin, 6, 14);
      ctx.textAlign='center';
      ctx.fillStyle='#a5f3fc';
      ctx.fillText('Level '+level, CW/2, 14);
      ctx.textAlign='right'; ctx.fillStyle='#86efac';
      ctx.fillText('Berikut: '+getLabelOf(next,next.rot), CW-6, 14);
    }

    // Keyboard
    const keys = {};
    function onKey(e) {
      if (!running) return;
      if (e.key==='ArrowLeft') { e.preventDefault(); moveLeft(); }
      if (e.key==='ArrowRight') { e.preventDefault(); moveRight(); }
      if (e.key==='ArrowDown') { e.preventDefault(); drop(); }
      if (e.key==='ArrowUp'||e.key===' ') { e.preventDefault(); rotate(); }
      if (e.key==='Enter') hardDrop();
    }
    document.addEventListener('keydown', onKey);

    // Tombol layar
    root.querySelector('#gtBL').addEventListener('touchstart', e=>{e.preventDefault();moveLeft();},{passive:false});
    root.querySelector('#gtBR').addEventListener('touchstart', e=>{e.preventDefault();moveRight();},{passive:false});
    root.querySelector('#gtBD').addEventListener('touchstart', e=>{e.preventDefault();drop();},{passive:false});
    root.querySelector('#gtBU').addEventListener('touchstart', e=>{e.preventDefault();rotate();},{passive:false});
    root.querySelector('#gtBL').onclick = moveLeft;
    root.querySelector('#gtBR').onclick = moveRight;
    root.querySelector('#gtBD').onclick = drop;
    root.querySelector('#gtBU').onclick = rotate;

    // Swipe
    let tx0=0, ty0=0;
    canvas.addEventListener('touchstart', e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
    canvas.addEventListener('touchend', e=>{
      const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
      if (Math.abs(dx)>Math.abs(dy)) { if(dx<-20)moveLeft(); else if(dx>20)moveRight(); }
      else { if(dy>20)drop(); else rotate(); }
    },{passive:true});

    function showGameOver() {
      obs.disconnect();
      document.removeEventListener('keydown', onKey);
      ui.style.pointerEvents='auto';
      ui.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.75)">
        <div style="background:#0f172a;border:3px solid #22c55e;border-radius:16px;padding:28px 36px;text-align:center;color:#fff;max-width:300px">
          <div style="font-size:48px">🧩</div>
          <h2 style="color:#ffe066;font-family:Nunito,sans-serif;margin:8px 0">Game Over!</h2>
          <p style="font-size:18px;margin:4px 0">Skor: <b style="color:#ffd34d">${poin}</b></p>
          <p style="font-size:14px;color:#86efac">Level: ${level} · Tripel: ${Math.floor(lines/3)}</p>
          <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
            <button onclick="PP.go('game_tetris')" style="background:#22c55e;color:#fff;border:none;border-radius:8px;padding:10px 20px;font:bold 15px Nunito,sans-serif;cursor:pointer">Main Lagi</button>
            <button onclick="PP.go('lomba')" style="background:#334155;color:#fff;border:none;border-radius:8px;padding:10px 20px;font:bold 15px Nunito,sans-serif;cursor:pointer">Kembali</button>
          </div>
        </div>
      </div>`;
      try { PPStore.recordMiniGame('tetris', poin, null); } catch(e){}
    }

    let raf;
    function loop() { update(); draw(); if(running) raf=requestAnimationFrame(loop); }
    newPiece(); raf=requestAnimationFrame(loop);
    root.addEventListener('pp-unmount', ()=>{ running=false; obs.disconnect(); document.removeEventListener('keydown',onKey); cancelAnimationFrame(raf); });
  }
})();

</script>

<script>
/* =========================================================
   PRESENTASI KOLABORATIF v2 — Firebase Storage + Slideshow
   Made by Didit Fakhrullah
   ========================================================= */
(function () {
  'use strict';

  /* ── Firebase langsung — tidak lewat PPCloud/PPNet ── */
  const FB = window.PP_FIREBASE || {};
  const FB_URL  = (FB.databaseURL || '').replace(/\/+$/, '');
  const FB_ROOT = FB.root || 'pythagoras';
  const MAX_FOTO_MB   = 3;
  const MAX_FOTO_BYTES = MAX_FOTO_MB * 1024 * 1024;
  const POLL_MS  = 5000;
  const FB_PATH  = `${FB_URL}/${FB_ROOT}/presentasi_kelas.json`;

  async function fbGet() {
    try {
      const r = await fetch(FB_PATH, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch(e) { return null; }
  }
  async function fbPut(id, val) {
    const url = FB_PATH.replace('.json', '') + `/${id}.json`;
    const r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) });
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + await r.text());
    return true;
  }
  async function fbPatch(id, val) {
    const url = FB_PATH.replace('.json', '') + `/${id}.json`;
    const r = await fetch(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return true;
  }
  async function fbDel(id) {
    const url = FB_PATH.replace('.json', '') + `/${id}.json`;
    const r = await fetch(url, { method: 'DELETE' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return true;
  }
  function fbUid() { return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fbWatch(cb, ms) {
    let last = '\0', stop = false, busy = false;
    async function tick() {
      if (stop || busy) return; busy = true;
      try { const v = await fbGet(); const s = JSON.stringify(v); if (s !== last) { last = s; if (!stop) cb(v); } } catch(e) {}
      busy = false;
    }
    tick();
    const t = setInterval(() => { if (!document.hidden) tick(); }, ms || POLL_MS);
    return () => { stop = true; clearInterval(t); };
  }

  /* ── Baca foto sebagai base64 ── */
  function fotoToBase64(file, onProgress) {
    return new Promise((ok, fail) => {
      const fr = new FileReader();
      fr.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
      fr.onload = e => ok(e.target.result);
      fr.onerror = fail;
      fr.readAsDataURL(file);
    });
  }

  /* ── Parse URL video jadi embed ── */
  function parseVideoUrl(raw) {
    const url = raw.trim();
    // YouTube
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (m) return { type: 'youtube', embedUrl: `https://www.youtube.com/embed/${m[1]}`, thumb: `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` };
    // Google Drive
    m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    if (m) return { type: 'gdrive', embedUrl: `https://drive.google.com/file/d/${m[1]}/preview`, thumb: '' };
    // Link langsung (mp4 dll)
    if (url.match(/\.(mp4|webm|ogg|mov)(\?|$)/i)) return { type: 'direct', embedUrl: url, thumb: '' };
    return null;
  }

  function fileIcon(mime) {
    if (!mime) return '📎';
    if (mime.startsWith('image/')) return '🖼️';
    if (mime.startsWith('video/')) return '🎬';
    if (mime.startsWith('audio/')) return '🎵';
    if (mime.includes('pdf')) return '📄';
    if (mime.includes('word') || mime.includes('document')) return '📝';
    if (mime.includes('sheet') || mime.includes('excel') || mime.includes('csv')) return '📊';
    if (mime.includes('presentation') || mime.includes('powerpoint')) return '📑';
    return '📎';
  }

  function myName() {
    try { return PPStore.data.name || 'Siswa'; } catch(e) { return 'Siswa'; }
  }
  function isGuru() {
    try { const av = PPStore.data.avatar || ''; return av.startsWith('guru'); } catch(e) { return false; }
  }
  function esc(s) { return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  /* ── Slideshow fullscreen ── */
  function bukaSlideshow(sorted) {
    if (!sorted.length) { alert('Belum ada file untuk ditampilkan.'); return; }
    let idx = 0;
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;';

    function slide(i) {
      const item = sorted[i][1];
      const mime = item.mime || '';
      const url  = item.url || item.data || '';
      let media = '';
      if (mime.startsWith('image/') && url) {
        media = `<img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain;display:block;">`;
      } else if (mime.startsWith('video/') && url) {
        media = `<video src="${url}" controls autoplay style="max-width:100%;max-height:100%;display:block;"></video>`;
      } else if (mime.startsWith('audio/') && url) {
        media = `<div style="text-align:center;padding:40px;"><div style="font-size:80px;margin-bottom:20px;">🎵</div><audio src="${url}" controls autoplay style="width:300px;"></audio></div>`;
      } else if (url) {
        media = `<div style="text-align:center;padding:40px;"><div style="font-size:80px;margin-bottom:16px;">${fileIcon(mime)}</div><p style="color:#fff;font-size:18px;margin:0 0 20px;">${esc(item.name||'Dokumen')}</p><a href="${url}" target="_blank" style="background:#7c3aed;color:#fff;padding:12px 28px;border-radius:10px;font-size:16px;font-weight:700;text-decoration:none;">⬇ Buka / Unduh</a></div>`;
      } else {
        media = `<div style="text-align:center;padding:40px;color:#666;"><div style="font-size:60px;">❌</div><p>File tidak tersedia</p></div>`;
      }

      overlay.innerHTML = `
        <div style="background:linear-gradient(90deg,#1e3a8a,#7c3aed);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;">
          <div style="color:#fff;">
            <b style="font-size:15px;">${esc(item.name||'Tanpa judul')}</b>
            <span style="font-size:12px;opacity:.7;margin-left:8px;">👤 ${esc(item.uploader||'')}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="color:#fff;font-size:13px;opacity:.8;">${i+1} / ${sorted.length}</span>
            <button id="slPrev" style="background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;padding:6px 14px;font-size:16px;cursor:pointer;">◀</button>
            <button id="slNext" style="background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;padding:6px 14px;font-size:16px;cursor:pointer;">▶</button>
            <button id="slClose" style="background:#ef4444;border:none;border-radius:8px;color:#fff;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer;">✕ Tutup</button>
          </div>
        </div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0f172a;">
          ${media}
        </div>
        ${item.ket ? `<div style="background:#1e293b;color:#94a3b8;padding:10px 20px;font-size:13px;text-align:center;flex-shrink:0;">${esc(item.ket)}</div>` : ''}`;

      overlay.querySelector('#slPrev').onclick = () => { idx = (idx - 1 + sorted.length) % sorted.length; slide(idx); };
      overlay.querySelector('#slNext').onclick = () => { idx = (idx + 1) % sorted.length; slide(idx); };
      overlay.querySelector('#slClose').onclick = () => { document.removeEventListener('keydown', onKey); overlay.remove(); };
    }

    function onKey(e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { idx = (idx+1) % sorted.length; slide(idx); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { idx = (idx-1+sorted.length) % sorted.length; slide(idx); }
      if (e.key === 'Escape') { document.removeEventListener('keydown', onKey); overlay.remove(); }
    }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    slide(0);
  }

  PP.screens = PP.screens || {};

  PP.screens.presentasi = function () {
    return {
      html: `<div class="wrap" style="max-width:860px;padding:0 8px 100px;">

        <div style="background:linear-gradient(135deg,#1e3a8a,#7c3aed);color:#fff;border-radius:16px;padding:20px 24px;margin-bottom:14px;">
          <h2 style="margin:0 0 4px;font-size:20px;">🎤 Presentasi Kelas</h2>
          <p style="margin:0;font-size:13px;opacity:.85;">Upload foto atau tambahkan link video YouTube/Google Drive — tampil di semua perangkat secara real-time.</p>
        </div>

        <!-- Tab pilih jenis -->
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <button id="tabFoto" style="flex:1;padding:10px;border-radius:10px;border:2px solid #7c3aed;background:#7c3aed;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">🖼️ Upload Foto</button>
          <button id="tabVideo" style="flex:1;padding:10px;border-radius:10px;border:2px solid #7c3aed;background:#fff;color:#7c3aed;font-weight:700;font-size:14px;cursor:pointer;">🎬 Tambah Video</button>
        </div>

        <!-- Panel Foto -->
        <div id="panelFoto">
          <div id="presUploadBox" style="border:3px dashed #7c3aed;border-radius:16px;padding:24px 20px;text-align:center;background:#f5f3ff;margin-bottom:10px;cursor:pointer;transition:background .2s;">
            <div style="font-size:44px;line-height:1;margin-bottom:8px;">📷</div>
            <b style="font-size:15px;color:#7c3aed;display:block;margin-bottom:4px;">Ketuk untuk pilih foto</b>
            <span style="font-size:12px;color:#6b7280;">Format: JPG, PNG, GIF, WebP — maks. ${MAX_FOTO_MB}MB per foto · bisa pilih banyak</span>
            <input type="file" id="presFileInput" multiple accept="image/*" style="display:none;">
          </div>
          <div id="presProgress" style="display:none;background:#ede9fe;border-radius:12px;padding:12px 16px;margin-bottom:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <div style="width:22px;height:22px;border:3px solid #7c3aed;border-top-color:transparent;border-radius:50%;animation:prespin .8s linear infinite;flex-shrink:0;"></div>
              <div style="flex:1;">
                <b id="presProgLabel" style="color:#7c3aed;font-size:13px;">Memproses...</b>
                <div style="height:5px;background:#ddd6fe;border-radius:4px;margin-top:4px;overflow:hidden;">
                  <div id="presProgFill" style="height:100%;background:#7c3aed;width:0%;transition:width .3s;border-radius:4px;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Panel Video -->
        <div id="panelVideo" style="display:none;">
          <div style="background:#f0fdf4;border:2px solid #86efac;border-radius:14px;padding:16px;margin-bottom:10px;">
            <p style="margin:0 0 10px;font-size:14px;font-weight:700;color:#166534;">🔗 Tempel link video</p>
            <input id="vidUrlInput" type="url" placeholder="https://www.youtube.com/watch?v=... atau Google Drive" style="width:100%;box-sizing:border-box;border:2px solid #86efac;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;margin-bottom:8px;">
            <input id="vidNameInput" type="text" placeholder="Judul video (opsional)" style="width:100%;box-sizing:border-box;border:2px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;margin-bottom:10px;">
            <button id="vidAddBtn" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;width:100%;">➕ Tambahkan Video</button>
            <p style="margin:8px 0 0;font-size:11px;color:#6b7280;">Mendukung: YouTube, Google Drive, atau link MP4 langsung</p>
          </div>
        </div>

        <!-- Tombol slideshow -->
        <button id="presBtnSlide" style="width:100%;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px;">▶ Mulai Presentasi Layar Penuh</button>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <h3 style="margin:0;font-size:15px;color:#1e293b;">📋 Semua Konten</h3>

        <div id="presList" style="display:flex;flex-direction:column;gap:12px;"></div>
        <div id="presLoading" style="text-align:center;padding:40px;color:#9ca3af;">
          <div style="font-size:36px;">⏳</div><p style="margin:8px 0 0;">Memuat...</p>
        </div>

        <style>
          @keyframes prespin { to { transform:rotate(360deg); } }
          .pc { background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.09);overflow:hidden;position:relative; }
          .pc-img { width:100%;max-height:380px;object-fit:contain;background:#0f172a;display:block;cursor:pointer; }

          .pc-meta { padding:12px 14px; }
          .pc-name { font-size:15px;font-weight:700;color:#1e293b;margin:0 0 4px; }
          .pc-ket  { font-size:13px;color:#475569;margin:0 0 8px;line-height:1.5;white-space:pre-wrap; }
          .pc-foot { display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px; }
          .pc-who  { font-size:11px;color:#94a3b8; }
          .pc-acts { display:flex;gap:6px;flex-wrap:wrap; }
          .pb { border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer; }
          .pb-edit   { background:#fef9c3;color:#854d0e; }
          .pb-del    { background:#fee2e2;color:#991b1b; }
          .pb-save   { background:#dcfce7;color:#166534; }
          .pb-cancel { background:#f1f5f9;color:#475569; }
          .pb-slide  { background:#ede9fe;color:#7c3aed; }
          .pc-num { position:absolute;top:8px;left:8px;background:#7c3aed;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px; }
          .pc-uplbl { position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 7px;font-size:10px; }
          .pc-form { background:#f8fafc;border-top:2px solid #e2e8f0;padding:12px 14px;display:none; }
          .pc-form.open { display:block; }
          .pc-inp { width:100%;box-sizing:border-box;border:2px solid #e2e8f0;border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;margin-bottom:7px; }
          .pc-inp:focus { outline:none;border-color:#7c3aed; }
          .pc-ta  { width:100%;box-sizing:border-box;border:2px solid #e2e8f0;border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:60px;margin-bottom:7px; }
          .pc-ta:focus  { outline:none;border-color:#7c3aed; }
          .pc-empty { text-align:center;padding:50px 20px;color:#9ca3af; }
          .pc-badge-foto  { background:#ede9fe;color:#7c3aed;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700; }
          .pc-badge-video { background:#fef3c7;color:#92400e;border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700; }
        </style>

        <p style="text-align:right;color:#ccc;font-size:11px;margin-top:20px;">Made by Didit Fakhrullah</p>
      </div>`,

      mount(root) {
        if (!FB_URL) {
          root.querySelector('#presList').innerHTML = '<p style="color:red;padding:20px;text-align:center;">⚠️ Firebase belum dikonfigurasi.</p>';
          root.querySelector('#presLoading').style.display = 'none';
          return;
        }

        const uploadBox = root.querySelector('#presUploadBox');
        const fileInput = root.querySelector('#presFileInput');
        const progress  = root.querySelector('#presProgress');
        const progLabel = root.querySelector('#presProgLabel');
        const progFill  = root.querySelector('#presProgFill');
        const listEl    = root.querySelector('#presList');
        const loadingEl = root.querySelector('#presLoading');
        const countEl   = root.querySelector('#presCount');
        const btnSlide  = root.querySelector('#presBtnSlide');
        const tabFoto   = root.querySelector('#tabFoto');
        const tabVideo  = root.querySelector('#tabVideo');
        const panelFoto = root.querySelector('#panelFoto');
        const panelVideo= root.querySelector('#panelVideo');
        const vidUrl    = root.querySelector('#vidUrlInput');
        const vidName   = root.querySelector('#vidNameInput');
        const vidAddBtn = root.querySelector('#vidAddBtn');

        let items = {}, sorted = [], stopWatch = null;

        /* Tab switching */
        tabFoto.onclick = () => {
          tabFoto.style.background='#7c3aed'; tabFoto.style.color='#fff';
          tabVideo.style.background='#fff'; tabVideo.style.color='#7c3aed';
          panelFoto.style.display=''; panelVideo.style.display='none';
        };
        tabVideo.onclick = () => {
          tabVideo.style.background='#7c3aed'; tabVideo.style.color='#fff';
          tabFoto.style.background='#fff'; tabFoto.style.color='#7c3aed';
          panelFoto.style.display='none'; panelVideo.style.display='';
        };

        /* Render */
        function renderPreview(item) {
          const url = item.url || '';
          if (item.type === 'video') {
            const info = parseVideoUrl(url);
            if (info && info.type === 'youtube') {
              return `<iframe class="pc-embed" src="${info.embedUrl}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;
            } else if (info && info.type === 'gdrive') {
              return `<iframe class="pc-embed" src="${info.embedUrl}" allowfullscreen></iframe>`;
            } else if (info && info.type === 'direct') {
              return `<video src="${url}" class="pc-embed" controls preload="metadata"></video>`;
            }
            return `<div style="background:#1e293b;padding:20px;text-align:center;"><a href="${esc(url)}" target="_blank" style="color:#7c3aed;font-size:13px;">🔗 Buka link video</a></div>`;
          }
          if (url) return `<img src="${url}" class="pc-img" alt="${esc(item.name||'')}">`;
          return `<div style="background:#1e293b;height:120px;display:flex;align-items:center;justify-content:center;color:#94a3b8;">Tidak ada preview</div>`;
        }

        function render(data) {
          loadingEl.style.display = 'none';
          if (!data || !Object.keys(data).length) {
            listEl.innerHTML = `<div class="pc-empty"><div style="font-size:52px;">📭</div><b style="font-size:15px;display:block;margin:8px 0 4px;">Belum ada konten</b><span style="font-size:13px;">Upload foto atau tambah link video!</span></div>`;
            countEl.textContent = '0 item'; sorted = []; return;
          }
          sorted = Object.entries(data).sort((a,b) => (a[1].order||a[1].ts||0)-(b[1].order||b[1].ts||0));
          countEl.textContent = sorted.length + ' item';
          listEl.innerHTML = '';

          sorted.forEach(([id, item], i) => {
            const mine = item.uploader === myName() || isGuru();
            const ts = item.ts ? new Date(item.ts).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
            const badge = item.type === 'video'
              ? `<span class="pc-badge-video">🎬 VIDEO</span>`
              : `<span class="pc-badge-foto">🖼️ FOTO</span>`;

            const card = document.createElement('div');
            card.className = 'pc'; card.dataset.id = id;
            card.innerHTML = `${renderPreview(item)}
              <div class="pc-num">${i+1}</div>
              <div class="pc-uplbl">${esc(item.uploader||'?')}</div>
              <div class="pc-meta">
                <p class="pc-name">${badge} ${esc(item.name||'Tanpa judul')}</p>
                <p class="pc-ket">${item.ket ? esc(item.ket) : '<span style="color:#94a3b8;font-style:italic;">Belum ada keterangan</span>'}</p>
                <div class="pc-foot">
                  <span class="pc-who">📅 ${ts}</span>
                  <div class="pc-acts">
                    <button class="pb pb-slide" data-slidestart="${i}">▶ Tayangkan</button>
                    ${mine ? `<button class="pb pb-edit" data-edit="${id}">✏️ Edit</button>` : ''}
                    ${mine ? `<button class="pb pb-del" data-del="${id}">🗑 Hapus</button>` : ''}
                  </div>
                </div>
              </div>
              <div class="pc-form" id="pf_${id}">
                <input class="pc-inp" id="pn_${id}" value="${esc(item.name||'')}" placeholder="Judul">
                <textarea class="pc-ta" id="pk_${id}" placeholder="Keterangan...">${esc(item.ket||'')}</textarea>
                <div style="display:flex;gap:8px;">
                  <button class="pb pb-save" data-save="${id}">💾 Simpan</button>
                  <button class="pb pb-cancel" data-cancel="${id}">Batal</button>
                </div>
              </div>`;
            listEl.appendChild(card);
          });

          listEl.querySelectorAll('[data-slidestart]').forEach(btn => {
            btn.onclick = () => bukaSlideshow(sorted, +btn.dataset.slidestart);
          });
          listEl.querySelectorAll('.pc-img[data-slide],.pc-img').forEach((el,i) => {
            el.onclick = () => bukaSlideshow(sorted, i);
          });
          listEl.querySelectorAll('[data-edit]').forEach(btn => {
            btn.onclick = () => root.querySelector('#pf_'+btn.dataset.edit)?.classList.toggle('open');
          });
          listEl.querySelectorAll('[data-cancel]').forEach(btn => {
            btn.onclick = () => root.querySelector('#pf_'+btn.dataset.cancel)?.classList.remove('open');
          });
          listEl.querySelectorAll('[data-save]').forEach(btn => {
            btn.onclick = async () => {
              const id = btn.dataset.save; btn.textContent='⏳'; btn.disabled=true;
              try {
                await fbPatch(id, { name: root.querySelector('#pn_'+id)?.value.trim()||'Tanpa judul', ket: root.querySelector('#pk_'+id)?.value.trim()||'' });
                btn.textContent='✅';
              } catch(e) { btn.textContent='❌'; alert('Gagal: '+e.message); }
              setTimeout(()=>{ btn.textContent='💾 Simpan'; btn.disabled=false; }, 1500);
              root.querySelector('#pf_'+id)?.classList.remove('open');
            };
          });
          listEl.querySelectorAll('[data-del]').forEach(btn => {
            btn.onclick = async () => {
              const id = btn.dataset.del;
              if (!confirm('Hapus "' + (data[id]?.name||'item ini') + '"?')) return;
              btn.textContent='⏳'; btn.disabled=true;
              try { await fbDel(id); } catch(e) { btn.textContent='❌'; btn.disabled=false; alert('Gagal: '+e.message); }
            };
          });
        }

        btnSlide.onclick = () => bukaSlideshow(sorted, 0);
        stopWatch = fbWatch(data => { items = data||{}; render(items); }, POLL_MS);

        /* Upload foto */
        uploadBox.addEventListener('click', () => fileInput.click());
        uploadBox.addEventListener('dragover', e => { e.preventDefault(); uploadBox.style.background='#ede9fe'; });
        uploadBox.addEventListener('dragleave', () => uploadBox.style.background='#f5f3ff');
        uploadBox.addEventListener('drop', e => { e.preventDefault(); uploadBox.style.background='#f5f3ff'; handleFotos([...e.dataTransfer.files]); });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFotos([...fileInput.files]); fileInput.value=''; });

        async function handleFotos(files) {
          const valid = files.filter(f => {
            if (!f.type.startsWith('image/')) { alert('"'+f.name+'" bukan foto. Gunakan tab Video untuk video.'); return false; }
            if (f.size > MAX_FOTO_BYTES) { alert('"'+f.name+'" terlalu besar (maks '+MAX_FOTO_MB+'MB). Kompres dulu ya.'); return false; }
            return true;
          });
          if (!valid.length) return;
          progress.style.display='block'; uploadBox.style.pointerEvents='none';
          for (let i=0; i<valid.length; i++) {
            const file = valid[i];
            progLabel.textContent = 'Memproses '+(i+1)+'/'+valid.length+': '+file.name;
            progFill.style.width = Math.round((i/valid.length)*50)+'%';
            try {
              const dataUrl = await fotoToBase64(file, pct => {
                progFill.style.width = Math.round(((i+pct*0.8)/valid.length)*100)+'%';
              });
              const id = fbUid();
              await fbPut(id, { id, type:'foto', name:file.name.replace(/\.[^.]+$/,''), ket:'', mime:file.type, uploader:myName(), ts:Date.now(), order:Date.now()+i, url:dataUrl });
              progFill.style.width = Math.round(((i+1)/valid.length)*100)+'%';
            } catch(err) { alert('Gagal upload "'+file.name+'":\n'+err.message); }
          }
          progLabel.textContent = '✅ '+valid.length+' foto tersimpan!';
          setTimeout(()=>{ progress.style.display='none'; progFill.style.width='0%'; }, 2500);
          uploadBox.style.pointerEvents='';
        }

        /* Tambah video */
        vidAddBtn.onclick = async () => {
          const raw = vidUrl.value.trim();
          if (!raw) { alert('Masukkan link video dulu.'); vidUrl.focus(); return; }
          const info = parseVideoUrl(raw);
          if (!info) { alert('Link tidak dikenali.\nContoh YouTube: https://www.youtube.com/watch?v=xxxxx\nGoogle Drive: https://drive.google.com/file/d/xxxxx/view'); return; }
          vidAddBtn.textContent='⏳'; vidAddBtn.disabled=true;
          try {
            const id = fbUid();
            const nama = vidName.value.trim() || 'Video ' + new Date().toLocaleString('id-ID',{day:'numeric',month:'short'});
            await fbPut(id, { id, type:'video', name:nama, ket:'', mime:'video/embed', uploader:myName(), ts:Date.now(), order:Date.now(), url:raw });
            vidUrl.value=''; vidName.value='';
            vidAddBtn.textContent='✅ Ditambahkan!';
          } catch(e) { alert('Gagal: '+e.message); }
          setTimeout(()=>{ vidAddBtn.textContent='➕ Tambahkan Video'; vidAddBtn.disabled=false; }, 2000);
        };

        root.addEventListener('pp-unmount', () => { if (stopWatch) stopWatch(); });
      }
    };
  };

  /* Slideshow — support foto & video embed */
  function bukaSlideshow(sorted, startIdx) {
    if (!sorted || !sorted.length) { alert('Belum ada konten.'); return; }
    let idx = typeof startIdx === 'number' ? startIdx : 0;
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;';

    function slide(i) {
      const item = sorted[i][1];
      const url  = item.url || '';
      let media  = '';
      if (item.type === 'video') {
        const info = parseVideoUrl(url);
        if (info && (info.type==='youtube'||info.type==='gdrive')) {
          media = `<iframe src="${info.embedUrl}" style="width:100%;height:100%;border:none;" allow="autoplay;fullscreen" allowfullscreen></iframe>`;
        } else if (info && info.type==='direct') {
          media = `<video src="${url}" controls autoplay style="max-width:100%;max-height:100%;display:block;"></video>`;
        } else {
          media = `<div style="text-align:center;padding:40px;"><a href="${esc(url)}" target="_blank" style="color:#7c3aed;font-size:16px;">🔗 Buka link video</a></div>`;
        }
      } else if (url) {
        media = `<img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain;display:block;">`;
      } else {
        media = `<div style="color:#666;text-align:center;padding:40px;font-size:40px;">❌</div>`;
      }

      overlay.innerHTML = `
        <div style="background:linear-gradient(90deg,#1e3a8a,#7c3aed);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;">
          <div style="color:#fff;min-width:0;flex:1;">
            <b style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;">${esc(item.name||'Tanpa judul')}</b>
            <span style="font-size:11px;opacity:.7;">👤 ${esc(item.uploader||'')} · ${item.type==='video'?'🎬 Video':'🖼️ Foto'}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <span style="color:#fff;font-size:12px;opacity:.8;">${i+1}/${sorted.length}</span>
            <button id="slPrev" style="background:rgba(255,255,255,.2);border:none;border-radius:7px;color:#fff;padding:5px 12px;font-size:16px;cursor:pointer;">◀</button>
            <button id="slNext" style="background:rgba(255,255,255,.2);border:none;border-radius:7px;color:#fff;padding:5px 12px;font-size:16px;cursor:pointer;">▶</button>
            <button id="slClose" style="background:#ef4444;border:none;border-radius:7px;color:#fff;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;">✕</button>
          </div>
        </div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0f172a;">${media}</div>
        ${item.ket ? `<div style="background:#1e293b;color:#94a3b8;padding:8px 18px;font-size:12px;text-align:center;flex-shrink:0;">${esc(item.ket)}</div>` : ''}`;

      overlay.querySelector('#slPrev').onclick = () => { idx=(idx-1+sorted.length)%sorted.length; slide(idx); };
      overlay.querySelector('#slNext').onclick = () => { idx=(idx+1)%sorted.length; slide(idx); };
      overlay.querySelector('#slClose').onclick = () => { document.removeEventListener('keydown',onKey); overlay.remove(); };
    }
    function onKey(e) {
      if (e.key==='ArrowRight'||e.key==='ArrowDown') { idx=(idx+1)%sorted.length; slide(idx); }
      if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   { idx=(idx-1+sorted.length)%sorted.length; slide(idx); }
      if (e.key==='Escape') { document.removeEventListener('keydown',onKey); overlay.remove(); }
    }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
    slide(idx);
  }

  PP.bukaSlideshow = bukaSlideshow;

})();
</script>
<script src="js/lomba.js"></script>
<script src="js/jsetup.js"></script>
<script src="js/flip_data.js"></script>
<script src="js/flip.js"></script>
</body>
